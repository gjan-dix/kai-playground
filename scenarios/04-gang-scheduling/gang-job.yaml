---
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-training
  namespace: kai-poc
  labels:
    app.kubernetes.io/part-of: aiflow-kai-poc
    poc.aiflow/scenario: gang-scheduling
    poc.aiflow/role: gang
  annotations:
    kai.scheduler/batch-min-member: '2'
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: aiflow-kai-poc
        poc.aiflow/scenario: gang-scheduling
        poc.aiflow/role: gang
        kai.scheduler/queue: default-queue
    spec:
      schedulerName: kai-scheduler
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      nodeSelector:
        run.ai/simulated-gpu-node-pool: default
        kubernetes.io/hostname: desktop-worker
      containers:
      - name: hold
        image: busybox:1.37.0
        command:
        - sh
        - "-c"
        args:
        - echo "Simulated GPU scheduling POC; no CUDA computation"; exec sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
            nvidia.com/gpu: 1
          limits:
            cpu: 100m
            memory: 64Mi
            nvidia.com/gpu: 1
