---
apiVersion: v1
kind: Pod
metadata:
  name: gang-holder
  namespace: kai-poc
  labels:
    app.kubernetes.io/part-of: aiflow-kai-poc
    poc.aiflow/scenario: gang-scheduling
    poc.aiflow/role: holder
    kai.scheduler/queue: default-queue
spec:
  schedulerName: kai-scheduler
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    run.ai/simulated-gpu-node-pool: default
    kubernetes.io/hostname: desktop-worker
  containers:
  - name: hold
    image: busybox:1.37.0
    command:
    - sh
    - "-c"
    args:
    - echo "Simulated GPU scheduling POC; no CUDA computation"; exec sleep 86400
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
        nvidia.com/gpu: 2
      limits:
        cpu: 100m
        memory: 64Mi
        nvidia.com/gpu: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-release
  namespace: kai-poc
  labels:
    app.kubernetes.io/part-of: aiflow-kai-poc
    poc.aiflow/scenario: gang-scheduling
    poc.aiflow/role: release
    kai.scheduler/queue: default-queue
spec:
  schedulerName: kai-scheduler
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    run.ai/simulated-gpu-node-pool: default
    kubernetes.io/hostname: desktop-worker
  containers:
  - name: hold
    image: busybox:1.37.0
    command:
    - sh
    - "-c"
    args:
    - echo "Simulated GPU scheduling POC; no CUDA computation"; exec sleep 86400
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
        nvidia.com/gpu: 1
      limits:
        cpu: 100m
        memory: 64Mi
        nvidia.com/gpu: 1
