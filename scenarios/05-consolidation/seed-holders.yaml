---
apiVersion: v1
kind: Pod
metadata:
  name: con-seed-1
  namespace: kai-poc
  labels:
    app.kubernetes.io/part-of: aiflow-kai-poc
    poc.aiflow/scenario: consolidation
    poc.aiflow/role: seed
    kai.scheduler/queue: aiflow-poc-consolidation
spec:
  schedulerName: kai-scheduler
  priorityClassName: aiflow-poc-consolidation-protected
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    run.ai/simulated-gpu-node-pool: default
    kubernetes.io/hostname: desktop-worker
  containers:
  - name: hold
    image: busybox:1.37.0
    command:
    - sh
    - "-c"
    args:
    - echo "Simulated GPU scheduling POC; no CUDA computation"; exec sleep 86400
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
        nvidia.com/gpu: 3
      limits:
        cpu: 100m
        memory: 64Mi
        nvidia.com/gpu: 3
