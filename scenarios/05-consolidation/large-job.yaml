---
apiVersion: batch/v1
kind: Job
metadata:
  name: con-large
  namespace: kai-poc
  labels:
    app.kubernetes.io/part-of: aiflow-kai-poc
    poc.aiflow/scenario: consolidation
    poc.aiflow/role: large
  annotations:
    kai.scheduler/batch-min-member: '1'
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: aiflow-kai-poc
        poc.aiflow/scenario: consolidation
        poc.aiflow/role: large
        kai.scheduler/queue: aiflow-poc-consolidation
    spec:
      schedulerName: kai-scheduler
      priorityClassName: aiflow-poc-consolidation-train
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      nodeSelector:
        run.ai/simulated-gpu-node-pool: default
      containers:
      - name: hold
        image: busybox:1.37.0
        command:
        - sh
        - "-c"
        args:
        - echo "Simulated GPU scheduling POC; no CUDA computation"; exec sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
            nvidia.com/gpu: 4
          limits:
            cpu: 100m
            memory: 64Mi
            nvidia.com/gpu: 4
