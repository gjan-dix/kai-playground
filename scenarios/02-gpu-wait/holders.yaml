apiVersion: v1
kind: Pod
metadata:
  name: gpu-holder-a
  namespace: kai-poc
  labels:
    app.kubernetes.io/part-of: aiflow-kai-poc
    poc.aiflow/scenario: gpu-wait
    poc.aiflow/role: holder
    kai.scheduler/queue: default-queue
spec:
  schedulerName: kai-scheduler
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    run.ai/simulated-gpu-node-pool: default
  containers:
    - name: hold
      image: busybox:1.37.0
      command: ["sh", "-c"]
      args: ["echo 'Holding 4 simulated GPUs; no CUDA computation'; exec sleep 86400"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          nvidia.com/gpu: 4
        limits:
          cpu: 100m
          memory: 64Mi
          nvidia.com/gpu: 4
---
