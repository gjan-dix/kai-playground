# KAI Scheduler Helm chart v0.18.6 / Kubernetes v1.36.1 / linux/arm64.
# Source: https://github.com/kai-scheduler/KAI-Scheduler/blob/v0.18.6/deployments/kai-scheduler/values.yaml
# Install with --version v0.18.6 (the chart version is pinned in versions.env).
# This file configures KAI; Fake GPU Operator supplies the simulated GPU devices.

openshift: false

global:
  registry: ghcr.io/kai-scheduler/kai-scheduler
  imagePullPolicy: IfNotPresent
  # Initial POC: whole GPUs only, without fractional GPU sharing.
  gpuSharingMode: Disabled
  nvFractions:
    set: false
  clusterAutoscaling: false
  # Match environment.resourceReservationNamespace in fake-gpu-values.yaml.
  resourceReservation:
    namespace: kai-resource-reservation
    createNamespace: true
    createServiceAccount: true

scheduler:
  enabled: true
  # Prefer packing workloads onto fewer nodes to reduce fragmentation.
  placementStrategy: binpack

defaultShard:
  enabled: true

defaultQueue:
  createDefaultQueue: true
  parentName: default-parent-queue
  childName: default-queue

# Time-based fairness and Prometheus integration are outside the initial POC.
prometheus:
  enabled: false
